[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-acoustic-radar"
version = "1.0.0"
description = "Monostatic acoustic OFDM radar on a laptop's own speaker and microphone: presence, activity and breathing sensing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enric Guasch Mesià" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/enricguaschmesia-lab/laptop-acoustic-radar"

[tool.setuptools]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]   # short lambdas describe motion paths in the simulator

[tool.ruff.lint.per-file-ignores]
# Frozen file: its sha256 is quoted in the results, so it stays byte-identical
"radar/processing.py" = ["B905"]
